<!-- Tabs for Storage Types -->
<div class="ui top attached tabular menu border-bottom">
    <a class="item active border" data-tab="external" ng-click="clearLogs(); requestExternalStoragePath()">External
        Storage</a>
    <a class="item border" data-tab="sdcard" ng-click="clearLogs(); requestSdCardPath()">Removable
        Storage</a>
</div>

<!-- Tab Content for External Storage -->
<div class="ui bottom attached tab segment active border" data-tab="external">
    <div class="ui segment {{load}} full" style="overflow-y:auto;overflow-x: auto;white-space:nowrap; height: 275px;"
        id="externalParent">
        <div class="ui list" style="overflow-y:auto;white-space:nowrap;" infinite-scroll="increaseLimit()"
            infinite-scroll-container='"#externalParent"'>
            <div class="item" ng-repeat="file in files | limitTo:barLimit | orderBy:['-isDir','name']">
                <a ng-click="clearLogs(); getFiles(file.path)" ng-if="file.isDir">
                    <i class="folder icon"></i> {{file.name}}
                </a>
                <div class="ui bg2 label" ng-if="!file.isDir">
                    <i class="file icon"></i> {{file.name}} &nbsp;&nbsp;
                    <a ng-click="clearLogs(); saveFile(file.path)"><i class="save red icon"></i></a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Tab Content for Removable Storage -->
<div class="ui bottom attached tab segment border" data-tab="sdcard">
    <div class="ui segment {{load}} full" style="overflow-y:auto;overflow-x: auto;white-space:nowrap; height: 275px;"
        id="removableParent">
        <div class="ui list" style="overflow-y:auto;white-space:nowrap;" infinite-scroll="increaseLimit()"
            infinite-scroll-container='"#removableParent"'>
            <div class="item" ng-repeat="file in files | limitTo:barLimit | orderBy:['-isDir','name']">
                <a ng-click="clearLogs(); getFiles(file.path)" ng-if="file.isDir">
                    <i class="folder icon"></i> {{file.name}}
                </a>
                <div class="ui bg2 label" ng-if="!file.isDir">
                    <i class="file icon"></i> {{file.name}} &nbsp;&nbsp;
                    <a ng-click="clearLogs(); saveFile(file.path)"><i class="save red icon"></i></a>
                </div>
            </div>
        </div>
    </div>
</div>
